<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tile Maker — field schema</title>
<style>
  body{background:#0b0b18;color:#e7ecf7;font:13px/1.6 ui-monospace,Menlo,monospace;margin:0;padding:26px 30px}
  h1{font:700 17px/1.3 -apple-system,system-ui,sans-serif;margin:0 0 4px}
  p{font:13px/1.55 -apple-system,system-ui,sans-serif;color:#8b96b5;margin:0 0 16px;max-width:70ch}
  button{font:600 13px -apple-system,system-ui,sans-serif;background:#11c4fd;color:#052733;
         border:0;border-radius:8px;padding:10px 16px;cursor:pointer;margin-bottom:16px}
  pre{background:#14142a;border-radius:10px;padding:16px;overflow:auto;max-height:64vh;white-space:pre-wrap}
  .bad{color:#ff7a90}
</style>
</head>
<body>
<h1>Field schema</h1>
<p>Read off the tool's own controls, so it cannot drift from what the UI accepts.
   Regenerates every time you open this page. Download and commit it as
   <code>brand/tile-schema.json</code> whenever the fields change.</p>
<button id="dl">Download tile-schema.json</button>
<pre id="out">loading the tool…</pre>
<script>
(async () => {
  const out = document.getElementById('out');
  const frame = document.createElement('iframe');
  frame.style.cssText = 'position:absolute;width:1200px;height:900px;left:-9999px';
  frame.src = 'kai-social-tile-maker.html';
  document.body.appendChild(frame);
  await new Promise(r => frame.onload = r);
  await new Promise(r => setTimeout(r, 1500));          // let the UI build
  const w = frame.contentWindow, d = frame.contentDocument;
  const F = w.eval('typeof FIELDS!=="undefined" ? FIELDS : null');
  if (!F){ out.className='bad'; out.textContent='could not read FIELDS'; return; }
  const labelFor = id => { const l = d.querySelector(`label[for="${id}"]`);
                           return l ? l.textContent.trim().replace(/\s+/g,' ') : null; };
  const schema = {};
  for (const f of F){
    const el = d.getElementById(f); if (!el) continue;
    const tag = el.tagName.toLowerCase();
    const r = { control: tag === 'select' ? 'enum'
              : el.type === 'checkbox' ? 'boolean'
              : (el.type === 'range' || el.type === 'number') ? 'number' : 'string' };
    const lab = labelFor(f); if (lab) r.label = lab;
    if (tag === 'select'){ r.options = [...el.options].map(o => o.value); r.default = el.value; }
    else if (el.type === 'checkbox') r.default = el.checked;
    else { r.default = el.value;
           if (el.min !== '') r.min = +el.min;
           if (el.max !== '') r.max = +el.max;
           if (el.step !== '' && el.step !== 'any') r.step = +el.step; }
    schema[f] = r;
  }
  const doc = { _comment: 'Generated by tile-maker/schema.html from the tool\'s own '
                        + 'controls. Every key is a field of a tile; enum fields list '
                        + 'the only accepted values.',
                _generated_from: 'kai-social-tile-maker.html',
                fields: schema };
  const text = JSON.stringify(doc, null, 2);
  out.textContent = text;
  document.title = Object.keys(schema).length + ' fields — schema';
  document.getElementById('dl').onclick = () => {
    const a = document.createElement('a');
    a.download = 'tile-schema.json';
    a.href = URL.createObjectURL(new Blob([text], {type:'application/json'}));
    a.click();
  };
  frame.remove();
})();
</script>
</body>
</html>
