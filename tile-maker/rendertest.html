<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tile Maker — render suite</title>
<style>
  body{ background:#0b0b18; color:#e7ecf7; font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
        margin:0; padding:28px 32px }
  h1{ font:700 17px/1.3 -apple-system,system-ui,sans-serif; margin:0 0 4px }
  p.sub{ font:13px/1.5 -apple-system,system-ui,sans-serif; color:#8b96b5; margin:0 0 22px }
  #out{ white-space:pre-wrap }
  .ok{ color:#57e08a } .bad{ color:#ff7a90 } .dim{ color:#8b96b5 }
  code{ background:#1a1a2e; padding:1px 5px; border-radius:4px }
</style>
</head>
<body>
  <h1>Render suite</h1>
  <p class="sub">Every category × shape × variant through <code>drawFrame</code> against a
     recording canvas, with the layout rules asserted numerically. Same assertions
     Node runs; this page exists because Node isn't installed.</p>
  <div id="out" class="dim">running…</div>
<script>
(async () => {
  const out = document.getElementById('out');
  const file = new URLSearchParams(location.search).get('file') || 'kai-social-tile-maker.html';
  try {
    const res = await fetch(file, { cache: 'no-store' });
    if (!res.ok) throw new Error(`${file} → HTTP ${res.status}`);
    globalThis.__TESTHTML = await res.text();
  } catch (e) {
    out.className = 'bad'; out.textContent = 'Could not load the tool: ' + e.message; return;
  }
  const s = document.createElement('script');
  s.src = 'rendertest.js?v=' + Date.now();
  s.onerror = () => { out.className = 'bad'; out.textContent = 'rendertest.js failed to load'; };
  s.onload  = () => {
    const r = globalThis.__TESTRESULT;
    if (!r){ out.className = 'bad'; out.textContent = 'suite produced no result'; return; }
    out.className = r.fail ? 'bad' : 'ok';
    out.textContent = r.report;
    document.title = `${r.pass}/${r.total} clean — render suite`;
  };
  window.onerror = (m, src, ln) => { out.className = 'bad'; out.textContent = `${m}\n  ${src}:${ln}`; };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
